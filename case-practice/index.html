<title>Case Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: one reading column, like a notepad on the interview table. Interviewer lines in serif, your work in sans, numbers in mono. */
:root{
  --bg:#f5f6f2; --grid:#e3e6de; --paper:#ffffff; --ink:#1c2430; --muted:#5d6672; --line:#d5d9d0;
  --accent:#0d6a63; --accent-ink:#ffffff; --hl:#fff1a8; --hl-ink:#3a3200;
  --good:#1f7a3a; --warn:#a46200; --bad:#b3261e; --iv:#eef1f6;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13171c; --grid:#1c2229; --paper:#1a2027; --ink:#e6e9ed; --muted:#9aa3ad; --line:#2d353e;
  --accent:#4fbfb3; --accent-ink:#0b1514; --hl:#4a4213; --hl-ink:#fff3b0;
  --good:#5cc97a; --warn:#e3a646; --bad:#f07a70; --iv:#212934; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171c; --grid:#1c2229; --paper:#1a2027; --ink:#e6e9ed; --muted:#9aa3ad; --line:#2d353e;
  --accent:#4fbfb3; --accent-ink:#0b1514; --hl:#4a4213; --hl-ink:#fff3b0;
  --good:#5cc97a; --warn:#e3a646; --bad:#f07a70; --iv:#212934; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0}
h1{font-size:2.3rem;line-height:1.1}
h2{font-size:1.6rem;line-height:1.2}
h3{font-size:1.15rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 13px}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.small{padding:4px 10px;font-size:.85rem}
textarea,input[type=text]{font:inherit;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:9px 11px}
textarea{min-height:84px;resize:vertical}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top .brand{font-family:var(--display);font-size:1.25rem;font-style:italic}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}

/* home */
.intro{display:grid;gap:12px;margin-bottom:26px}
.intro p{max-width:62ch;color:var(--muted)}
.method{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:28px}
.method ol{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}
.method li span{color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{text-align:left;display:grid;gap:8px;padding:14px 16px;border-radius:10px;background:var(--paper)}
.card h3{font-size:1.2rem}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.d-Easy{color:var(--good);border-color:currentColor}
.d-Medium{color:var(--warn);border-color:currentColor}
.d-Hard{color:var(--bad);border-color:currentColor}
.status{font-size:.8rem;color:var(--muted)}
.status.done{color:var(--good);font-weight:600}
.fitcard{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:14px 16px}

/* case view */
.casehead{display:grid;gap:8px;margin-bottom:18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.timer{font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.timer.over{color:var(--bad)}
.progress{display:flex;gap:4px}
.progress i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.turns{display:grid;gap:22px}
.turn{display:grid;gap:10px}
.iv{background:var(--iv);border-radius:4px 12px 12px 12px;padding:12px 16px;max-width:92%}
.iv .who,.youlbl{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.iv p,.iv .say{font-family:var(--display);font-size:1.12rem;line-height:1.45}
.iv .say p+p{margin-top:8px}
.you{display:grid;gap:8px;margin-left:auto;width:min(100%,640px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{max-width:220px}
.verdict{font-size:.88rem;font-weight:600}
.verdict.good{color:var(--good)} .verdict.close{color:var(--warn)} .verdict.bad{color:var(--bad)}
.unit{font-size:.82rem;color:var(--muted)}
.data{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px;display:grid;gap:8px}
.answer{background:var(--hl);color:var(--hl-ink);border-radius:6px;padding:12px 16px;display:grid;gap:8px}
.answer .lbl,.data .lbl{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.8}
.answer ul,.data ul{margin:0;padding-left:18px}
.answer li+li,.data li+li{margin-top:3px}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left;white-space:nowrap}
.answer th,.answer td{border-color:color-mix(in srgb,var(--hl-ink) 25%,transparent)}
th{font-weight:600}
.calc{font-family:var(--mono);font-size:.86rem;line-height:1.7;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border-radius:999px;font-size:.88rem}
.chips button.asked{background:var(--iv);color:var(--muted)}
.qa{display:grid;gap:8px}
.next{display:flex;justify-content:flex-end}
.score{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:12px}
.scoregrid{display:grid;gap:10px}
.scoreline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.scoreline small{grid-column:1/-1;color:var(--muted);font-size:.8rem}
.dots{display:flex;gap:4px}
.dots button{width:34px;padding:5px 0;text-align:center}
.dots button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.notes{margin-top:30px;display:grid;gap:6px}
.muted{color:var(--muted)}
.tip{font-size:.85rem;color:var(--muted);font-style:italic}
@media (prefers-reduced-motion:no-preference){.turn.new{animation:rise .35s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
@media (max-width:520px){h1{font-size:1.85rem}.iv{max-width:100%}}
</style>

<div class="wrap" id="app"></div>

<script>
const CASES = [
{
  id:"diapers", title:"Diapers in KSA", type:"Market Sizing", diff:"Easy",
  prompt:"Estimate the market size of diapers in KSA.",
  style:"Interviewee-led. Make your own estimates first. Ask for the interviewer's numbers only after you've committed to yours.",
  clarify:[
    {q:"Do we include adult diapers?", a:"Yes, elderly people are included."},
    {q:"Cloth or disposable?", a:"Only disposable diapers."},
    {q:"Market size by value or by volume?", a:"By sales value, in dollars, not by volume."},
    {q:"Over what time period?", a:"Give me an annual figure."}
  ],
  steps:[
    {ask:"How would you approach this? Walk me through your structure before any numbers.",
     answer:`<p>Supply-side doesn't help here. Go demand-side and segment the population by age:</p>
<ul><li>Population → people per age year (population ÷ life expectancy)</li><li>Users: babies 0–3 and elderly (e.g. 75–80) with a usage % per group</li><li>Diapers per user per day → daily diapers → yearly diapers</li><li>× price per diaper → $ market size</li></ul>`},
    {ask:"Good. What numbers will you use for KSA's population and life expectancy? How many people does that give you per age year?",
     num:{value:437500, tol:.1, unit:"people per age year"},
     data:`<p>Population of KSA is <b>35M</b>. Life expectancy is <b>80 years</b>. Assume an even distribution across ages.</p>`,
     answer:`<p class="calc">35M ÷ 80 ≈ 437.5k → round to ~450k people per age year</p>`},
    {ask:"Now take it to diapers. How many diapers are used in KSA per day?",
     num:{value:12.6e6, tol:.08, unit:"diapers per day"},
     data:`<div class="tw"><table><tr><th>Age group</th><th>0–1</th><th>1–2</th><th>2–3</th><th>75–80</th></tr>
<tr><td>Diaper use (%)</td><td>100%</td><td>90%</td><td>80%</td><td>30%</td></tr>
<tr><td>Avg. quantity per day</td><td>10</td><td>8</td><td>6</td><td>4</td></tr></table></div>`,
     answer:`<div class="tw"><table><tr><th>Group</th><th>People</th><th>Use</th><th>Users</th><th>/day</th><th>Diapers/day</th></tr>
<tr><td>0–1</td><td>450k</td><td>100%</td><td>450k</td><td>10</td><td>4.5M</td></tr>
<tr><td>1–2</td><td>450k</td><td>90%</td><td>405k</td><td>8</td><td>3.2M</td></tr>
<tr><td>2–3</td><td>450k</td><td>80%</td><td>360k</td><td>6</td><td>2.2M</td></tr>
<tr><td>75–80</td><td>450k × 5 = 2.25M</td><td>30%</td><td>675k</td><td>4</td><td>2.7M</td></tr></table></div>
<p><b>≈ 12.6M diapers per day.</b> Watch the trap: 75–80 is five age years, not one.</p>`},
    {ask:"A pack of 12 diapers costs $6. What's the annual market size?",
     num:{value:2.3e9, tol:.06, unit:"$ per year"},
     answer:`<p class="calc">12.6M/day × 365 ≈ 4.6B diapers/year
4.6B × ($6 ÷ 12) = 4.6B × $0.50 ≈ $2.3B per year</p>`},
    {ask:"Wrap it up for me. What's the number, and how confident are you in it?",
     answer:`<p>About <b>$2.3B per year</b>. Sanity-check it out loud: babies drive ~80% of volume. The biggest swing factors are the elderly usage rate and the age groups you included (only 75–80 here), plus the even-age-distribution assumption, which understates babies in a young population like KSA's.</p>`}
  ]
},
{
  id:"hotdog", title:"Hot Dog Stand", type:"Profitability", diff:"Easy",
  prompt:"Your client has a hot dog stand that has been experiencing a decline in profitability in the past few months, and they want to know what the problem is.",
  style:"Interviewee-led. Estimate numbers yourself first; the interviewer gives figures if you're far off.",
  clarify:[
    {q:"Where is the stand?", a:"In Hamra, Beirut."},
    {q:"What do they sell, and for how much?", a:"A standard meal: a hot dog and a drink for $6."},
    {q:"Who are the competitors? Are they affected too?", a:"Our direct competitor is Frank's Hot Dog, and they're not facing any problem. Indirect competitors are Roadster Diner and other restaurants."},
    {q:"Any big recent investments?", a:"No. Disregard fixed costs; the truck has been running for a while."}
  ],
  steps:[
    {ask:"How would you structure this problem?",
     answer:`<p>Profit = Revenue − Costs.</p><ul><li><b>Revenue</b>: price × meals sold (plus any other streams)</li><li><b>Costs</b>: fixed (truck, already paid) and variable (food, utilities, rent, labor, waste)</li></ul><p>Since Frank's is fine, the issue is likely internal to our stand, not market-wide.</p>`},
    {ask:"Let's do revenue first. How many meals do you think the stand sells per day, and what's the monthly revenue?",
     num:{value:2700, tol:.03, unit:"$ per month (30 days)"},
     data:`<p>The stand sells <b>15 meals per day</b>.</p>`,
     answer:`<p class="calc">$6 × 15 meals = $90/day × 30 = $2,700/month</p>`},
    {ask:"Here's the cost picture. What's the stand's monthly profit?",
     num:{value:-100, tol:.02, unit:"$ per month (use − for a loss)"},
     data:`<ul><li>COGS: they use a 3× pricing strategy (price = 3 × food cost)</li><li>Utilities (gas and electricity): $400/month</li><li>Rent: $800/month</li><li>Labor (1 chef): $500/month</li><li>Expired food: $200/month</li></ul>`,
     answer:`<p class="calc">COGS = $6 ÷ 3 = $2/meal × 15 × 30 = $900
Costs = 900 + 400 + 800 + 500 + 200 = $2,800/month
Profit = 2,700 − 2,800 = −$100/month</p>`},
    {ask:"They're in the red. How can they increase profitability? Give me a structured answer.",
     answer:`<p><b>Increase revenues</b></p><ul><li>Raise prices, minding customers' price elasticity</li><li>Grow volume through marketing or new menu items</li><li>New revenue streams: ads on the truck, delivery, toppings</li></ul>
<p><b>Decrease costs</b></p><ul><li>Move to cheaper rent (risky: location is a key asset)</li><li>Cut COGS without hurting quality</li><li><b>Inventory</b>: $200/month of expired food is the obvious leak. Forecast demand from monthly trends and order less. Fixing this alone flips the stand to +$100.</li></ul>`},
    {ask:"Give me your recommendation for the owner in 30 seconds.",
     answer:`<p>The stand loses ~$100/month. The quickest fix is cutting the $200 of monthly food waste through demand forecasting, which makes it profitable on its own. Then grow volume (15 meals/day is low for Hamra; check why Frank's does better) and test a modest price increase or add-ons.</p>`}
  ]
},
{
  id:"concert", title:"Concert in Riyadh", type:"Profitability", diff:"Easy",
  prompt:"Our client is an entertainment company that wants to do a concert in Riyadh with a famous DJ, and they have come to us to see if it's a good idea or not.",
  style:"Interviewee-led. Lay out what you need, then ask for the data.",
  clarify:[
    {q:"What does 'good idea' mean for them?", a:"Primarily: will it make money? Then what else they need to get right."},
    {q:"Is this a one-off event?", a:"Yes, a single concert."},
    {q:"What revenue streams are there?", a:"Ticket sales and sponsorships. I'll give you the numbers when you're ready."}
  ],
  steps:[
    {ask:"How would you structure this?",
     answer:`<ul><li><b>Profitability</b>: revenues (tickets by tier, sponsors, extras) − costs (artist, venue, operations, commissions)</li><li><b>Feasibility</b>: licenses and regulations, local partner, cultural norms</li><li><b>Demand</b>: can we sell out, and how?</li></ul>`},
    {ask:"Here's the revenue side. What's the total revenue?",
     num:{value:38000, tol:.02, unit:"$"},
     data:`<div class="tw"><table><tr><th></th><th>VIP</th><th>Regular</th></tr><tr><td>Tickets</td><td>400</td><td>600</td></tr><tr><td>Price</td><td>$50</td><td>$20</td></tr></table></div>
<div class="tw"><table><tr><th>Sponsor</th><th>Amount</th></tr><tr><td>EJ Entertainment</td><td>$3,000</td></tr><tr><td>Sky Events</td><td>$2,000</td></tr><tr><td>DJDS Events</td><td>$1,000</td></tr></table></div>`,
     answer:`<p class="calc">VIP: $50 × 400 = $20,000
Regular: $20 × 600 = $12,000
Sponsors: $6,000
Total = $38,000</p>`},
    {ask:"And the costs. What's the profit if the concert sells out?",
     num:{value:15800, tol:.02, unit:"$"},
     data:`<ul><li>$3 commission to PR affiliates on each ticket sold</li><li>DJ: $6,000</li><li>Venue rent: $5,000</li><li>Maintenance and insurance: $4,000</li><li>Operational expenses: $4,200</li></ul>`,
     answer:`<p class="calc">Fixed: 6,000 + 5,000 + 4,000 + 4,200 = $19,200
Variable: $3 × 1,000 tickets = $3,000
Costs = $22,200
Profit = 38,000 − 22,200 = $15,800</p>`},
    {ask:"This seems profitable. What other aspects of the event do we need to address?",
     answer:`<ul><li><b>Barriers to entry</b>: event license; local regulations (a local partner may be required)</li><li><b>Culture and preferences</b>: e.g. audience arrangements that respect local norms</li><li><b>Selling out</b>: online box office, local stores, social media; start sales 1–6 months ahead</li><li><b>Extra revenue</b>: merch and accessories, DJ memorabilia, food carts, non-alcoholic drinks, valet parking</li></ul>`},
    {ask:"So, should they do it?",
     answer:`<p>Yes. At full occupancy it makes ~$15.8k on $38k revenue (≈42% margin). Breakeven needs most VIP seats sold, so the risk is in ticket sales: secure the license and local partner first, start sales early, and add F&B and merch to cushion lower turnout.</p>`}
  ]
},
{
  id:"banker", title:"Billionaire Banker", type:"Market Entry", diff:"Easy",
  prompt:"Your client is a billionaire who is considering entering the Saudi banking sector. Should they do it or not? What are the factors that should be considered?",
  style:"Discussion case. Bring your own ideas; the interviewer will steer.",
  clarify:[
    {q:"Does the client have banking experience?", a:"No, no past experience in the banking industry."},
    {q:"How competitive is the market?", a:"It's relatively saturated, but there's still room for an entrant like our client."},
    {q:"Any regulations in the way?", a:"No new regulations prevent them from entering. Saudization should be considered, though."},
    {q:"What's their objective? Return, timeline, risk?", a:"Good question. Keep it in mind; it'll matter at the end."}
  ],
  steps:[
    {ask:"What factors would you look at?",
     answer:`<ul><li><b>Competitors</b>: who they are, how established, their goals; market trends and projections</li><li><b>Barriers to entry</b>: Saudi partner (Saudization), government regulation</li><li><b>Market size and share</b>: what share can we realistically capture; competitors' shares</li></ul><p>Then: how to enter (build vs. buy) and the economics of each.</p>`},
    {ask:"There are two ways in. Here are the numbers. What's the payback period of each option?",
     num:{value:6.8, tol:.04, unit:"years, for Option 1 (then do Option 2 in your notes)"},
     data:`<div class="tw"><table><tr><th>Option 1: open our own bank</th><th>Option 2: acquire an existing player</th></tr>
<tr><td>Initial investment: $15M</td><td>Cost of acquisition: $20M</td></tr>
<tr><td>Yearly revenues: $10M</td><td>Yearly profit: $2.5M</td></tr>
<tr><td>Profit margin: 22%</td><td></td></tr></table></div>`,
     answer:`<p class="calc">Option 1: profit = $10M × 22% = $2.2M/yr → 15 ÷ 2.2 ≈ 6.8 years
Option 2: 20 ÷ 2.5 = 8 years</p>`},
    {ask:"So Option 1 pays back faster. Is it the better choice?",
     answer:`<p>Not necessarily. Building from scratch is riskier: the client has no experience or credibility, and the $10M revenue is a forecast. An acquisition brings an existing customer base and real, proven profits. The answer depends on the client's <b>risk appetite</b>.</p>`},
    {ask:"Give me your final recommendation.",
     answer:`<p>Enter. There is room in the market and no regulatory block. If the client is risk-averse, acquire: 8-year payback, but on established customers and proven profits. If they accept risk, build: ~6.8-year payback, but forecast-based and without banking expertise. Either way, plan for Saudization and a local partner.</p>`}
  ]
},
{
  id:"tv", title:"TV Family Business", type:"Market Entry", diff:"Medium",
  prompt:"Our client is a family business in Dubai that wants to acquire a TV channel broadcasting company. They already own and operate businesses in the F&B and transportation sectors. Is this a good idea or not?",
  style:"Interviewee-led. Estimate first; ask for numbers when you need them.",
  clarify:[
    {q:"What's the client's objective?", a:"A payback period of less than 5 years."},
    {q:"How does the channel make money?", a:"Advertisements are the only revenue stream."},
    {q:"Do they have the money and expertise?", a:"Yes, assume they have the expertise and capability."},
    {q:"Any barriers to entry or regulations?", a:"No barriers to entry."}
  ],
  steps:[
    {ask:"How would you approach this?",
     answer:`<ul><li><b>Client</b>: financial capacity, expertise, conflicts with existing businesses</li><li><b>Market</b>: competitors, leaders, potential share, barriers (regulation, antitrust)</li><li><b>Profitability</b>: revenue streams × price × volume; initial investment, fixed and variable costs → payback</li></ul>`},
    {ask:"Client capability and market are fine, so let's go to profitability. Here's how the channel runs. What's the maximum yearly ad revenue?",
     num:{value:9e6, tol:.04, unit:"$ per year"},
     data:`<ul><li>The channel broadcasts 24/7 for 300 days per year</li><li>Every hour has 10 minutes of ads and 50 minutes of content</li><li>Peak hours (4 h/day): 1 minute of ads costs $250</li><li>Non-peak hours (20 h/day): 1 minute of ads costs $100</li></ul>`,
     answer:`<p class="calc">Peak:     $250 × 10 min × 4 h × 300 days = $3M
Non-peak: $100 × 10 min × 20 h × 300 days = $6M
Total = $9M per year</p>`},
    {ask:"Initial investment is $15M and yearly operating costs are $6M, mostly labor. What's the payback period?",
     num:{value:5, tol:.03, unit:"years"},
     answer:`<p class="calc">Profit = 9 − 6 = $3M/yr → 15 ÷ 3 = 5 years</p>`},
    {ask:"Does that result make sense to you?",
     num:{value:7.5, tol:.04, unit:"years, the revised payback"},
     data:`<p>Actual yearly revenue is <b>$8M</b>.</p>`,
     answer:`<p>No. $9M assumes every ad slot is sold. The limit is demand, not supply. With actual revenue of $8M:</p><p class="calc">Profit = 8 − 6 = $2M → 15 ÷ 2 = 7.5 years</p><p>That misses the 5-year target.</p>`},
    {ask:"How could they maximize profit to speed up payback?",

function cs(id){store[id]=store[id]||{step:0,asked:[],ans:{},num:{},seen:{},scores:{},done:false,notes:"",secs:0};return store[id]}

/* ---------- number parsing ---------- */
function parseNum(s){
  if(!s)return NaN;
  let t=String(s).toLowerCase().replace(/[$,\s]/g,"").replace(/years?|yrs?|ppl|people/g,"");
  let neg=false;
  if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1)}
  const m=t.match(/^(-?\d*\.?\d+)(k|thousand|m|mm|mn|million|b|bn|billion)?$/);
  if(!m)return NaN;
  let v=parseFloat(m[1]);
  const u=m[2]||"";
  if(u==="k"||u==="thousand")v*=1e3;
  else if(["m","mm","mn","million"].includes(u))v*=1e6;
  else if(["b","bn","billion"].includes(u))v*=1e9;
  return neg?-v:v;
}
function judge(spec,v){
  if(isNaN(v))return["bad","I couldn't read that number. Try 2.3B, 450k or 1750."];
  if(spec.min!=null){
    if(v>=spec.min&&v<=spec.max)return["good","In the range the interviewer expects."];
    const lo=spec.min*.8,hi=spec.max*1.2;
    return v>=lo&&v<=hi?["close","Close, but outside the expected range. Can you defend it?"]:["bad","Off from what the interviewer expects. Revisit your logic."];
  }
  const err=Math.abs(v-spec.value)/Math.max(Math.abs(spec.value),1e-9);
  if(err<=spec.tol)return["good","Spot on."];
  if(err<=.2)return["close","In the ballpark, within 20%. Check your rounding or a step."];
  if(Math.sign(v)!==Math.sign(spec.value))return["bad","Wrong sign. Check whether this is a gain or a loss."];
  return["bad","Not there yet. Re-check your steps, or ask for the data."];
}

  return `<div class="turn ${isCurrent?"new":""}">

     <textarea id="ans-${c.id}-${k}" data-ans="${k}" placeholder="Talk it through out loud, then jot your structure or math here…">${esc(s.ans[k]||"")}</textarea>
     ${st.num?`<div class="numrow"><input type="text" id="num-${c.id}-${k}" data-num="${k}" value="${esc(nv)}" placeholder="Your number" inputmode="decimal"><button class="small" data-check="${k}">Check number</button><span class="unit">${st.num.unit}</span></div><div id="v-${k}">${v}</div>`:""}
     <div class="row">
       ${st.data&&!seenData?`<button class="small" data-reveal="d${k}">Ask for the data</button>`:""}
       ${!seenAns?`<button class="small ghost" data-reveal="a${k}">Show model answer</button>`:""}
     </div>

   ${st.data&&seenData?`<div class="data"><span class="lbl">Interviewer hands you</span>${st.data}</div>`:""}

  const total=c.steps.length;
  const shown=s.done?total:Math.min(s.step,total);
  let turns=`<div class="turn"><div class="iv"><span class="who">Interviewer</span><div class="say"><p>${c.prompt}</p><p><i>What questions do you have before you start?</i></p></div></div>
   <div class="you"><label class="youlbl" for="ans-${c.id}-q">Your clarifying questions</label>
   <textarea id="ans-${c.id}-q" data-ans="q" placeholder="Write your own questions first…">${esc(s.ans.q||"")}</textarea>
   <div class="chips">${c.clarify.map((q,j)=>`<button class="${s.asked.includes(j)||ivMode?"asked":""}" data-ask="${j}">${q.q}</button>`).join("")}</div></div>
   ${c.clarify.map((q,j)=>(s.asked.includes(j)||ivMode)?`<div class="iv"><span class="who">Interviewer · ${esc(q.q)}</span><p>${q.a}</p></div>`:"").join("")}
  </div>`;
  for(let i=0;i<shown;i++)turns+=stepHTML(c,s,i,i===shown-1);
  const finished=shown>=total;
  const nextBtn=!finished?`<div class="next"><button class="primary" data-next>${shown===0?"I'm ready, start the case":"Next question"}</button></div>`:"";
  const scoreBox=finished?`<div class="score"><h3>Debrief: score yourself</h3><div class="scoregrid">${SCORE_DIMS.map(([d,h])=>`<div class="scoreline"><b>${d}</b><div class="dots" role="group" aria-label="${d} score">${[1,2,3,4,5].map(n=>`<button data-score="${d}" data-n="${n}" aria-pressed="${s.scores[d]===n}">${n}</button>`).join("")}</div><small>${h}</small></div>`).join("")}</div>
   <div class="row"><button class="primary" data-done>${s.done?"Saved":"Finish case"}</button><button class="ghost" data-reset>Restart this case</button><span class="status">Time on case: ${fmtT(s.secs)}</span></div></div>`:"";
  app.innerHTML=topBar()+`
  <div class="bar"><button class="small ghost" data-home>← All cases</button>
   <div class="progress" aria-label="Progress">${c.steps.map((_,i)=>`<i class="${i<shown?"on":""}"></i>`).join("")}</div>
   <div class="row"><span class="timer ${s.secs>1800?"over":""}" id="timer">${fmtT(s.secs)}</span><button class="small" data-pause>${view.paused?"Resume":"Pause"}</button></div></div>
  <header class="casehead"><div class="meta"><span class="chip">${c.type}</span><span class="chip d-${c.diff}">${c.diff}</span></div><h2>${c.title}</h2><p class="tip">${c.style}</p></header>
  <div class="turns">${turns}${nextBtn}${scoreBox}</div>
  <div class="notes"><label class="youlbl" for="notes-${c.id}">Scratch notes</label><textarea id="notes-${c.id}" data-notes placeholder="Numbers, assumptions, things to say in the recommendation…">${esc(s.notes||"")}</textarea></div>`;
  clearInterval(tick);
  if(!view.paused&&!s.done)tick=setInterval(()=>{s.secs++;const t=document.getElementById("timer");if(t){t.textContent=fmtT(s.secs);t.classList.toggle("over",s.secs>1800)}if(s.secs%5===0)save()},1000);
}

function renderFit(){
  const q=FIT[view.q];
  app.innerHTML=topBar()+`
  <div class="bar"><button class="small ghost" data-home>← All cases</button><span class="timer" id="fittimer">02:00</span></div>
  <div class="turns"><div class="turn"><div class="iv"><span class="who">Interviewer</span><p>${q}</p></div>
  <div class="you"><label class="youlbl" for="fit-ans">Your answer (bullets are fine; say it out loud)</label><textarea id="fit-ans" placeholder="Situation, what you did, result, what it says about you…"></textarea>
  <div class="row"><button class="primary" data-fit>Next question</button></div></div></div>
  <div class="data"><span class="lbl">Casebook tips</span><ul><li>Tell a story, not a list. Make the personal details that make you "you" shine.</li><li>Stay concise: past 1.5–2 minutes, the interviewer loses the thread.</li><li>Don't recite memorized answers; prepare stories and stay spontaneous.</li><li>For leadership: give the reasons behind your actions and own your shortcomings. Leader ≠ boss.</li><li>For "Why this firm": use real conversations with its people, not just what's online.</li></ul></div></div>`;
  let left=120;const t=document.getElementById("fittimer");
  clearInterval(fitTick);fitTick=setInterval(()=>{left--;if(t){t.textContent=left>=0?fmtT(left):"-"+fmtT(-left);t.classList.toggle("over",left<0)}},1000);
}

function render(){
  if(view.name==="case")renderCase();else if(view.name==="fit")renderFit();else renderHome();
}

/* ---------- events ---------- */
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if("open"in d)return go({name:"case",id:d.open});
  if("filter"in d){filter=d.filter;return render()}
  if("home"in d){save();return go({name:"home"})}
  if("fit"in d){let n;do{n=Math.floor(Math.random()*FIT.length)}while(view.name==="fit"&&n===view.q&&FIT.length>1);return go({name:"fit",q:n})}
  if(view.name!=="case")return;
  const c=CASES.find(x=>x.id===view.id), s=cs(c.id);
  if("ask"in d){const j=+d.ask;if(!s.asked.includes(j))s.asked.push(j)}
  else if("next"in d){s.step=Math.min(s.step+1,c.steps.length)}
  else if("reveal"in d){s.seen[d.reveal]=true}
  else if("check"in d){const inp=document.getElementById(`num-${c.id}-${d.check}`);s.num[d.check]=inp.value;const [cls,msg]=judge(c.steps[+d.check].num,parseNum(inp.value));document.getElementById("v-"+d.check).innerHTML=`<span class="verdict ${cls}">${msg}</span>`;save();return}
  else if("score"in d){s.scores[d.score]=+d.n}
  else if("done"in d){s.done=true}
  else if("pause"in d){view.paused=!view.paused}
  else if("reset"in d){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Tap again to erase your answers";return}delete store[c.id];save();return go({name:"case",id:c.id})}
  save();
  const y=window.scrollY;renderCase();
  if("next"in d){const turns=app.querySelectorAll(".turn");turns[turns.length-1]?.scrollIntoView({behavior:"smooth",block:"start"})}else window.scrollTo(0,y);
});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="ivmode"){ivMode=t.checked;try{localStorage.setItem(KEY+"-iv",ivMode?"1":"0")}catch(er){}const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(view.name!=="case")return;
  const s=cs(view.id);
  if(t.dataset.ans!=null)s.ans[t.dataset.ans]=t.value;
  else if(t.dataset.num!=null)s.num[t.dataset.num]=t.value;
  else if("notes"in t.dataset)s.notes=t.value;
  save();
});
app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.num!=null){e.preventDefault();app.querySelector(`[data-check="${e.target.dataset.num}"]`)?.click()}
});
render();
</script>
